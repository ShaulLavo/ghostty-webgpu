name: Site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site.yml'
      - 'site/**'
      - 'site-classic/**'
      - 'src/**'
      - 'docs/**'
      - 'package.json'
      - 'bun.lock'
      - '*.wasm'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install
      - run: bun install --cwd site-classic
      - name: Build package
        run: bun run build
      - name: Build classic site
        run: bun run site:classic:build --base /ghostty-webgpu/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site-classic/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
