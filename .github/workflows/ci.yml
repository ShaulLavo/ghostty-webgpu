name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
          submodules: recursive
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Classify native resolver state
        id: native-state
        run: |
          set -euo pipefail
          state="$(bun scripts/verify-config-resolver-artifacts.ts --state either)"
          if [[ "$state" != 'bootstrap' && "$state" != 'assembled' ]]; then
            echo 'native resolver state classifier returned an invalid state' >&2
            exit 1
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - run: bunx playwright install --with-deps chromium
      - name: Verify source-only bootstrap state
        if: ${{ steps.native-state.outputs.state == 'bootstrap' }}
        run: bun run verify:source-only
      - name: Verify assembled package state
        if: ${{ steps.native-state.outputs.state == 'assembled' }}
        run: bun run verify
