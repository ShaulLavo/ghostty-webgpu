name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.paths.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright@sha256:bc6ab0d6d44ff4826e4cb8c1e6d801e185bfc42bb0753f8e2a30efc70db054c7 # v1.63.0-noble, amd64
    timeout-minutes: 30
    steps:
      - name: Require a ready PR
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          echo '::error::Mark this PR ready for review to run the required checks.'
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v3
        id: paths
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**/*.md'
              - '!README.md'
              - '!AGENTS.md'
              - '!LICENSE'
      - name: Install Bun archive extractor
        shell: bash
        run: |
          set -euo pipefail
          started_ms="$(date +%s%3N)"
          apt-get update
          apt-get install -y --no-install-recommends unzip xz-utils
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rm -rf /var/lib/apt/lists/*
          finished_ms="$(date +%s%3N)"
          echo "Bun archive extractor setup duration_ms=$((finished_ms - started_ms))"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: dependency-cache
        with:
          path: |
            ~/.bun/install/cache
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-bun-playwright-${{ hashFiles('bun.lock') }}
      - name: Log dependency cache result
        env:
          CACHE_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
        run: echo "Dependency cache hit=${CACHE_HIT:-false}"
      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          started_ms="$(date +%s%3N)"
          bun install --frozen-lockfile
          finished_ms="$(date +%s%3N)"
          echo "JavaScript dependency setup duration_ms=$((finished_ms - started_ms))"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: '0.16.0'
      - name: Test bridge row identity index
        run: bun run test:bridge
      - name: Validate Playwright system dependencies
        shell: bash
        run: |
          set -euo pipefail
          started_ms="$(date +%s%3N)"
          if ! bunx playwright install-deps --dry-run chromium; then
            echo 'Playwright system dependency validation failed; the pinned runner image contract is incomplete.' >&2
            exit 1
          fi
          finished_ms="$(date +%s%3N)"
          echo "Playwright system dependency validation duration_ms=$((finished_ms - started_ms))"
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          started_ms="$(date +%s%3N)"
          bunx playwright install chromium
          finished_ms="$(date +%s%3N)"
          echo "Playwright browser setup duration_ms=$((finished_ms - started_ms))"
      # The same checks as `bun run verify`, minus the browser suite and the sites, which have their own jobs.
      - name: Build and check all packages
        run: bun run build && bun run verify:extensions && bun run typecheck && bun run lint && bun run format:check
      - name: Unit tests
        run: bun run test:unit
      - name: Renderer fallback smoke
        run: bun run test:renderer-smoke
      - name: Docs examples
        run: bun run --cwd site docs:check
      - name: Pack and check the release tarballs
        run: bun run pack:release && bun run test:package:built
      - name: Verify the same three tarballs with production npm settings
        env:
          NODE_ENV: production
          npm_config_omit: dev
        run: bun run test:package:built
      - name: Verify native state and assembled host package
        shell: bash
        run: |
          set -euo pipefail
          state="$(bun scripts/verify-config-resolver-artifacts.ts --state either)"
          case "$state" in
            assembled) bun scripts/package-smoke.ts --tarball "$PWD/.artifacts/ghostty-webgpu.tgz" ;;
            bootstrap) echo 'Native resolver is source-only; browser package checks passed.' ;;
            *) echo 'Invalid native resolver state' >&2; exit 1 ;;
          esac
      - name: Package the verified browser and site build
        run: bun scripts/verified-build-artifact.ts pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-build
          path: .artifacts/verified-build
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages
          path: |
            .artifacts/ghostty-webgpu.tgz
            .artifacts/ghostty-webgpu-line-editor.tgz
            .artifacts/ghostty-webgpu-shaders.tgz
            .artifacts/release.json
          include-hidden-files: true
          if-no-files-found: error

  # The browser suite runs files one at a time per runner (SwiftShader), so it is sharded across runners.
  browser:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    needs: verify
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright@sha256:bc6ab0d6d44ff4826e4cb8c1e6d801e185bfc42bb0753f8e2a30efc70db054c7 # v1.63.0-noble, amd64
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: browser (${{ matrix.shard }}/4)
    steps:
      - name: Documentation-only PR has no browser inputs
        if: needs.verify.outputs.code != 'true'
        run: echo 'Browser checks report for every ready PR; browser inputs did not change.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.verify.outputs.code == 'true'
        with:
          persist-credentials: false
      - name: Install Bun archive extractor
        if: needs.verify.outputs.code == 'true'
        shell: bash
        run: |
          set -euo pipefail
          started_ms="$(date +%s%3N)"
          apt-get update
          apt-get install -y --no-install-recommends unzip xz-utils
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rm -rf /var/lib/apt/lists/*
          finished_ms="$(date +%s%3N)"
          echo "Bun archive extractor setup duration_ms=$((finished_ms - started_ms))"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: needs.verify.outputs.code == 'true'
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs.verify.outputs.code == 'true'
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.verify.outputs.code == 'true'
        with:
          name: verified-build
          path: .artifacts/verified-build
      - name: Verify the build artifact identity and outputs
        if: needs.verify.outputs.code == 'true'
        run: bun scripts/verified-build-artifact.ts verify
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: needs.verify.outputs.code == 'true'
        id: dependency-cache
        with:
          path: |
            ~/.bun/install/cache
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-bun-playwright-${{ hashFiles('bun.lock') }}
      - name: Log dependency cache result
        if: needs.verify.outputs.code == 'true'
        env:
          CACHE_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
        run: echo "Dependency cache hit=${CACHE_HIT:-false}"
      - name: Install JavaScript dependencies
        if: needs.verify.outputs.code == 'true'
        shell: bash
        run: |
          set -euo pipefail
          started_ms="$(date +%s%3N)"
          bun install --frozen-lockfile
          finished_ms="$(date +%s%3N)"
          echo "JavaScript dependency setup duration_ms=$((finished_ms - started_ms))"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: needs.verify.outputs.code == 'true'
        with:
          version: '0.16.0'
      - name: Validate Playwright system dependencies
        if: needs.verify.outputs.code == 'true'
        shell: bash
        run: |
          set -euo pipefail
          started_ms="$(date +%s%3N)"
          if ! bunx playwright install-deps --dry-run chromium; then
            echo 'Playwright system dependency validation failed; the pinned runner image contract is incomplete.' >&2
            exit 1
          fi
          finished_ms="$(date +%s%3N)"
          echo "Playwright system dependency validation duration_ms=$((finished_ms - started_ms))"
      - name: Install Playwright Chromium
        if: needs.verify.outputs.code == 'true'
        shell: bash
        run: |
          set -euo pipefail
          started_ms="$(date +%s%3N)"
          bunx playwright install chromium
          finished_ms="$(date +%s%3N)"
          echo "Playwright browser setup duration_ms=$((finished_ms - started_ms))"
      - name: Browser tests
        if: needs.verify.outputs.code == 'true'
        run: bun run test:browser --shard=${{ matrix.shard }}/4

  sites:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    needs: verify
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright@sha256:bc6ab0d6d44ff4826e4cb8c1e6d801e185bfc42bb0753f8e2a30efc70db054c7 # v1.63.0-noble, amd64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Bun archive extractor
        shell: bash
        run: |
          set -euo pipefail
          started_ms="$(date +%s%3N)"
          apt-get update
          apt-get install -y --no-install-recommends unzip xz-utils
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rm -rf /var/lib/apt/lists/*
          finished_ms="$(date +%s%3N)"
          echo "Bun archive extractor setup duration_ms=$((finished_ms - started_ms))"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-build
          path: .artifacts/verified-build
      - name: Verify the build artifact identity and outputs
        run: bun scripts/verified-build-artifact.ts verify
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: dependency-cache
        with:
          path: |
            ~/.bun/install/cache
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-bun-playwright-${{ hashFiles('bun.lock') }}
      - name: Log dependency cache result
        env:
          CACHE_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
        run: echo "Dependency cache hit=${CACHE_HIT:-false}"
      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          started_ms="$(date +%s%3N)"
          bun install --frozen-lockfile
          finished_ms="$(date +%s%3N)"
          echo "JavaScript dependency setup duration_ms=$((finished_ms - started_ms))"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: '0.16.0'
      - name: Validate Playwright system dependencies
        shell: bash
        run: |
          set -euo pipefail
          started_ms="$(date +%s%3N)"
          if ! bunx playwright install-deps --dry-run chromium; then
            echo 'Playwright system dependency validation failed; the pinned runner image contract is incomplete.' >&2
            exit 1
          fi
          finished_ms="$(date +%s%3N)"
          echo "Playwright system dependency validation duration_ms=$((finished_ms - started_ms))"
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          started_ms="$(date +%s%3N)"
          bunx playwright install chromium
          finished_ms="$(date +%s%3N)"
          echo "Playwright browser setup duration_ms=$((finished_ms - started_ms))"
      - name: Build the scene site from the verified packages
        working-directory: site
        run: bun run typecheck && bun scripts/sync-assets.ts && bunx astro build --base /
      - name: Package the existing custom-domain Worker without deploying
        run: bun run site:worker:dry-run
      - name: Build the classic site from the verified packages
        working-directory: site-classic
        run: bun run typecheck && bun scripts/sync-assets.ts && bunx astro build --base /ghostty-webgpu/
      - name: Verify both docs sites, examples and search
        run: bun run sites:verify "$PWD/.artifacts/docs-browser" 4327
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: docs-browser
          path: .artifacts/docs-browser
          include-hidden-files: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-worker
          path: |
            site/dist
            .artifacts/site-worker
            wrangler.jsonc
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: site-classic/dist
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, browser, sites]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages
          path: packages
      - name: Verify release tag, source identity, and package checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: bun scripts/release.ts validate packages "$RELEASE_TAG" "$RELEASE_COMMIT"
      - name: Publish tested packages as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" packages/*.tgz packages/release.json --verify-tag --generate-notes --draft
