name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-bun-playwright-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Build and verify all packages
        run: bun run verify
      - name: Verify the same tarball with production npm settings
        env:
          NODE_ENV: production
          npm_config_omit: dev
        run: bun run test:package:built
      - name: Verify native state and assembled host package
        shell: bash
        run: |
          set -euo pipefail
          state="$(bun scripts/verify-config-resolver-artifacts.ts --state either)"
          case "$state" in
            assembled) bun scripts/package-smoke.ts --tarball "$PWD/.artifacts/ghostty-webgpu.tgz" ;;
            bootstrap) echo 'Native resolver is source-only; browser package checks passed.' ;;
            *) echo 'Invalid native resolver state' >&2; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: .artifacts/*.tgz
          if-no-files-found: error
      - name: Build the classic site from the verified packages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: site-classic
        run: bun run typecheck && bun scripts/sync-assets.ts && bunx astro build --base /ghostty-webgpu/
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: site
          path: site-classic/dist
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages
      - name: Publish tested packages as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" packages/*.tgz --verify-tag --generate-notes --draft
